<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fitness.bg - Domain For Sale</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0b0b0f; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
  <script>
    (async () => {
      const app = new PIXI.Application();
      await app.init({
        resizeTo: window,
        background: 0x0b0b0f,
        antialias: true,
      });
      document.body.appendChild(app.canvas);

      const w = app.screen.width;
      const h = app.screen.height;

      // Subtle grid lines
      const grid = new PIXI.Graphics();
      const spacing = 80;
      grid.setStrokeStyle({ width: 1, color: 0xffffff, alpha: 0.03 });
      for (let x = 0; x <= w; x += spacing) {
        grid.moveTo(x, 0);
        grid.lineTo(x, h);
      }
      for (let y = 0; y <= h; y += spacing) {
        grid.moveTo(0, y);
        grid.lineTo(w, y);
      }
      grid.stroke();
      app.stage.addChild(grid);

      // Soft glow in center
      const glow = new PIXI.Graphics();
      glow.circle(0, 0, 280);
      glow.fill({ color: 0xffffff, alpha: 0.015 });
      glow.x = w / 2;
      glow.y = h / 2 - 40;
      app.stage.addChild(glow);

      // Main container
      const content = new PIXI.Container();
      content.x = w / 2;
      content.y = h / 2 - 20;
      app.stage.addChild(content);

      // FOR SALE badge - pill shape
      const badgeContainer = new PIXI.Container();
      badgeContainer.y = -110;

      const badgeText = new PIXI.Text({
        text: 'FOR SALE  /  ЗА ПРОДАЖБА',
        style: {
          fontFamily: 'Arial, Helvetica, sans-serif',
          fontSize: 12,
          fontWeight: '700',
          fill: 0xff3b3b,
          letterSpacing: 4,
        },
      });
      badgeText.anchor.set(0.5);

      const padX = 24;
      const padY = 10;
      const badge = new PIXI.Graphics();
      badge.roundRect(
        -badgeText.width / 2 - padX,
        -badgeText.height / 2 - padY,
        badgeText.width + padX * 2,
        badgeText.height + padY * 2,
        20
      );
      badge.fill({ color: 0xff3b3b, alpha: 0.08 });
      badge.setStrokeStyle({ width: 1, color: 0xff3b3b, alpha: 0.3 });
      badge.stroke();

      badgeContainer.addChild(badge);
      badgeContainer.addChild(badgeText);
      content.addChild(badgeContainer);

      // Pulse the badge
      let pulseTime = 0;
      app.ticker.add((ticker) => {
        pulseTime += ticker.deltaTime * 0.03;
        const pulse = 0.85 + 0.15 * Math.sin(pulseTime);
        badgeContainer.alpha = pulse;
      });

      // Domain name
      const domain = new PIXI.Text({
        text: 'fitness.bg',
        style: {
          fontFamily: 'Arial, Helvetica, sans-serif',
          fontSize: Math.min(78, w * 0.13),
          fontWeight: '700',
          fill: 0xffffff,
        },
      });
      domain.anchor.set(0.5);
      domain.y = 0;
      content.addChild(domain);

      // Tagline
      const tagline = new PIXI.Text({
        text: 'Този премиум домейн е наличен за закупуване',
        style: {
          fontFamily: 'Arial, Helvetica, sans-serif',
          fontSize: 15,
          fontWeight: '400',
          fill: 0x555555,
        },
      });
      tagline.anchor.set(0.5);
      tagline.y = 60;
      content.addChild(tagline);

      // Divider line
      const line = new PIXI.Graphics();
      line.setStrokeStyle({ width: 1, color: 0xffffff, alpha: 0.1 });
      line.moveTo(-40, 0);
      line.lineTo(40, 0);
      line.stroke();
      line.y = 90;
      content.addChild(line);

      // Contact label
      const contactLabel = new PIXI.Text({
        text: 'Контакт / Contact',
        style: {
          fontFamily: 'Arial, Helvetica, sans-serif',
          fontSize: 13,
          fontWeight: '400',
          fill: 0x555555,
        },
      });
      contactLabel.anchor.set(0.5);
      contactLabel.y = 118;
      content.addChild(contactLabel);

      // Email
      const email = new PIXI.Text({
        text: 'ivodimitrov@mail.bg',
        style: {
          fontFamily: 'Arial, Helvetica, sans-serif',
          fontSize: 18,
          fontWeight: '400',
          fill: 0xcccccc,
        },
      });
      email.anchor.set(0.5);
      email.y = 145;
      email.eventMode = 'static';
      email.cursor = 'pointer';
      email.on('pointerover', () => { email.style.fill = 0xffffff; });
      email.on('pointerout', () => { email.style.fill = 0xcccccc; });
      email.on('pointertap', () => {
        window.location.href = 'mailto:contact@fitness.bg';
      });
      content.addChild(email);

      // Fade in
      content.alpha = 0;
      let fadeIn = 0;
      app.ticker.add(() => {
        if (fadeIn < 1) {
          fadeIn += 0.02;
          content.alpha = Math.min(fadeIn, 1);
        }
      });

      // Handle resize
      window.addEventListener('resize', () => {
        const nw = app.screen.width;
        const nh = app.screen.height;
        content.x = nw / 2;
        content.y = nh / 2 - 20;
        glow.x = nw / 2;
        glow.y = nh / 2 - 40;
        domain.style.fontSize = Math.min(78, nw * 0.13);
      });
    })();
  </script>
</body>
</html>
